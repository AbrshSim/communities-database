<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Community Directory</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f7;--card:#fff;--line:#e3e5e8;--tx:#1e1f22;--mut:#5c6068;--acc:#5865f2;--acc2:#4752c4;--inp:#f2f3f5;--sh:0 1px 2px rgba(0,0,0,.06);--ok:#23a55a;--warn:#c27c0e;--bad:#e5484d;--sb:#c4c7cc;--sbh:#9da1a8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1b1e;--card:#232428;--line:#2e3035;--tx:#f2f3f5;--mut:#a3a6ad;--inp:#1a1b1e;--sh:none;--sb:#43464d;--sbh:#5d616b;--warn:#e0a030}}
:root[data-theme="dark"]{--bg:#1a1b1e;--card:#232428;--line:#2e3035;--tx:#f2f3f5;--mut:#a3a6ad;--inp:#1a1b1e;--sh:none;--sb:#43464d;--sbh:#5d616b;--warn:#e0a030}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
.wrap{max-width:1180px;margin:0 auto;padding:40px 24px 64px}
header{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:28px}
h1{margin:0;font-size:28px;letter-spacing:-.02em}
.sub{color:var(--mut);margin:4px 0 0}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input,textarea{font:inherit;color:var(--tx);background:var(--inp);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;outline:none;transition:border .15s}
input:focus,textarea:focus{border-color:var(--acc)}
input:disabled{opacity:.45}
input[type=checkbox]{width:auto;accent-color:var(--acc)}
textarea{resize:vertical;min-height:84px}
.search{width:220px}
.btn{font:inherit;font-weight:600;border:0;border-radius:10px;padding:10px 18px;cursor:pointer;background:var(--acc);color:#fff;transition:background .15s}
.btn:hover{background:var(--acc2)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--inp)}
.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
.btn:focus-visible,.card:focus-visible,.x:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;box-shadow:var(--sh);transition:transform .15s,border-color .15s;display:flex;flex-direction:column;text-align:left;padding:0;font:inherit;color:inherit}
.card:hover{transform:translateY(-3px);border-color:var(--acc)}
.banner{height:110px}
.body{padding:0 16px 16px;flex:1;display:flex;flex-direction:column}
.av{width:52px;height:52px;border-radius:14px;margin-top:-26px;border:4px solid var(--card);display:grid;place-items:center;color:#fff;font-weight:700;font-size:20px}
.name{font-weight:700;font-size:16px;margin:10px 0 4px;overflow-wrap:anywhere}
.desc{color:var(--mut);font-size:13px;margin:0 0 16px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;flex:1}
.meta{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.sec{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin:0 0 10px}
.empty{grid-column:1/-1;text-align:center;padding:64px 16px;border:1px dashed var(--line);border-radius:12px;color:var(--mut)}
.empty b{display:block;color:var(--tx);font-size:18px;margin-bottom:6px}
.veil{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.veil.on{display:flex}
.modal{background:var(--card);border:1px solid var(--line);border-radius:16px;width:100%;max-width:500px;max-height:90vh;overflow:auto;padding:24px}
.modal h2{margin:0 0 6px;font-size:20px;overflow-wrap:anywhere}
label{display:block;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin:14px 0 6px}
label.chk{text-transform:none;letter-spacing:0;font-weight:500;font-size:13px;margin:6px 0 0;display:flex;gap:6px;align-items:center;cursor:pointer}
.hint{font-size:12px;color:var(--mut);margin-top:4px}
.err{color:var(--bad);font-size:13px;margin-top:10px;min-height:1px}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--mut);background:var(--inp);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.st{font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;border:1px solid currentColor;text-transform:capitalize}
.st.pending{color:var(--warn)}.st.approved{color:var(--ok)}.st.declined{color:var(--bad)}
.x{float:right;background:transparent;border:0;color:var(--mut);font-size:26px;line-height:1;cursor:pointer;border-radius:8px;width:34px;height:34px}
.x:hover{background:var(--inp);color:var(--tx)}
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tab{font:inherit;font-weight:600;font-size:14px;background:transparent;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer}
.tab.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--inp);border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:13px;overflow-wrap:anywhere}
.chip.no{color:var(--mut);font-style:italic}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.toast.on{opacity:1}
.note{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;color:var(--mut);font-size:13px;margin-bottom:20px}
.mem{display:inline-block;margin:0 6px 6px 0;background:var(--inp);border:1px solid var(--line);border-radius:8px;padding:3px 10px;font-size:13px}
*{scrollbar-width:thin;scrollbar-color:var(--sb) transparent}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:var(--sb);border-radius:999px;border:3px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:var(--sbh);background-clip:content-box;border:3px solid transparent}
*::-webkit-scrollbar-corner{background:transparent}
select{font:inherit;color:var(--tx);background:var(--inp);border:1px solid var(--line);border-radius:10px;padding:8px 12px;outline:none;cursor:pointer}
select:focus{border-color:var(--acc)}
.chg{font-size:11px;font-weight:700;color:var(--warn);border:1px solid currentColor;border-radius:999px;padding:0 7px;text-transform:none;letter-spacing:0;margin-left:6px;white-space:nowrap}
.mem.add{border-color:var(--ok);color:var(--ok)}
.mem.rem{border-color:var(--bad);color:var(--bad);text-decoration:line-through;opacity:.8}

</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Community Directory</h1>
      <p class="sub" id="count">Loading…</p>
    </div>
    <div class="bar">
      <input class="search" id="q" type="search" placeholder="Search communities" aria-label="Search communities">
      <span id="auth" class="bar"></span>
    </div>
  </header>
  <div class="grid" id="grid"></div>
</div>

<div class="veil" id="mv"><div class="modal" id="mb" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const DB={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){toast('Could not save — browser storage is blocked or full');return false}}};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const names=t=>[...new Set(t.split(/[\n,]+/).map(s=>s.trim()).filter(Boolean))];
const fmt=n=>Number(n||0).toLocaleString();
const cnt=c=>(c.memberNames||[]).length;
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h};
const grad=s=>{const h=hue(s);return `background:linear-gradient(135deg,hsl(${h} 70% 55%),hsl(${(h+50)%360} 70% 40%))`};
const date=t=>new Date(t).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'});
let tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2800)}
function openModal(html){$('mb').innerHTML=html;$('mv').classList.add('on');document.body.style.overflow='hidden';const x=$('mb').querySelector('[data-close]');if(x)x.onclick=closeModal}
function closeModal(){$('mv').classList.remove('on');document.body.style.overflow=''}
$('mv').addEventListener('mousedown',e=>{if(e.target===$('mv'))closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
/* Shared storage keys: cd_users (public accounts), cd_apps (all community submissions) */
const snap=(a,t)=>({name:a.name,description:a.description,memberNames:[...(a.memberNames||[])],contact:{email:null,telegram:null,phone:null,...(a.contact||{})},savedAt:t||a.createdAt||Date.now()});
/* versions = history of every submitted/edited version; published = what the public sees (set on approval) */
const norm=a=>{if(!a.versions)a={...a,versions:[snap(a)]};if(a.status==='approved'&&a.published===undefined)a={...a,published:snap(a)};return a};
const apps=()=>DB.get('cd_apps',[]).map(norm);
const saveApps=a=>DB.set('cd_apps',a);
const card=c=>`<button class="card" data-id="${esc(c.id)}"><div class="banner" style="${grad(c.name)}"></div><div class="body"><div class="av" style="${grad(c.name)}">${esc(c.name.trim().charAt(0).toUpperCase())}</div><div class="name">${esc(c.name)}</div><p class="desc">${esc(c.description)}</p><div class="meta"><span class="dot"></span>${fmt(cnt(c))} ${cnt(c)===1?'member':'members'}</div></div></button>`;

const USERS='cd_users',SESSION='cd_session';
let me=null;
const users=()=>DB.get(USERS,[]);

async function hash(p,salt){
  const d=new TextEncoder().encode(salt+':'+p);
  if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',d);return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  let h=5381;for(const x of d)h=((h*33)^x)>>>0;return 'f'+h;
}
function loadMe(){const id=DB.get(SESSION,null);me=id?users().find(u=>u.id===id)||null:null}

/* ---------- header + list ---------- */
function renderAuth(){
  $('auth').innerHTML=me
    ?`<span class="pill">${esc(me.name)}</span><button class="btn ghost" id="mine">My submissions</button><button class="btn ghost" id="out">Log out</button><button class="btn" id="add">+ Register community</button>`
    :`<button class="btn ghost" id="login">Log in</button><button class="btn" id="add">+ Register community</button>`;
}
function render(){
  renderAuth();
  const q=$('q').value.trim().toLowerCase();
  const all=apps().filter(a=>a.published).map(a=>({...a.published,id:a.id}));
  const list=all.filter(c=>!q||(c.name+' '+c.description).toLowerCase().includes(q));
  $('count').textContent=all.length?`${all.length} ${all.length===1?'community':'communities'}`:'No communities yet';
  $('grid').innerHTML=list.length?list.map(card).join(''):`<div class="empty"><b>${all.length?'No matches':'Nothing here yet'}</b>${all.length?'Try a different search.':'Approved communities will show up here.'}</div>`;
}
$('grid').addEventListener('click',e=>{
  const b=e.target.closest('.card');if(!b)return;
  const ap=apps().find(x=>x.id===b.dataset.id&&x.published);if(!ap)return;const c=ap.published;
  const n=cnt(c);
  openModal(`<button class="x" data-close aria-label="Close">&times;</button>
    <div style="display:flex;gap:14px;align-items:center;margin-bottom:14px"><div class="av" style="${grad(c.name)};margin:0;width:56px;height:56px;border:0">${esc(c.name.trim().charAt(0).toUpperCase())}</div>
    <div><h2>${esc(c.name)}</h2><span class="pill"><span class="dot"></span>${fmt(n)} ${n===1?'member':'members'}</span></div></div>
    <p style="white-space:pre-wrap;overflow-wrap:anywhere;margin:0 0 16px">${esc(c.description)}</p>
    <div class="note" style="margin:0">Member names and contact details are private and only visible to admins.</div>`);
});
$('q').addEventListener('input',render);

/* ---------- auth ---------- */
function authModal(mode,after){
  const su=mode==='signup';
  openModal(`<button class="x" data-close aria-label="Close">&times;</button>
    <h2>${su?'Create an account':'Log in'}</h2>
    <div class="hint">${su?'You need an account to register a community.':'Log in to register your community.'}</div>
    <form id="af" onsubmit="return false">
      ${su?'<label for="an">Your name</label><input id="an" maxlength="60" autocomplete="name" required>':''}
      <label for="ae">Email</label><input id="ae" type="email" autocomplete="email" required>
      <label for="ap">Password</label><input id="ap" type="password" minlength="6" autocomplete="${su?'new-password':'current-password'}" required>
      ${su?'<div class="hint">At least 6 characters.</div>':''}
      <div class="err" id="aerr"></div>
      <div class="row"><button type="button" class="btn ghost" id="sw">${su?'I have an account':'Create account'}</button><button class="btn" type="submit">${su?'Sign up':'Log in'}</button></div>
    </form>`);
  $('sw').onclick=()=>authModal(su?'login':'signup',after);
  $('af').addEventListener('submit',async()=>{
    const email=$('ae').value.trim().toLowerCase(),pw=$('ap').value,all=users(),er=$('aerr');
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){er.textContent='Enter a valid email address.';return}
    if(su){
      const name=$('an').value.trim();
      if(!name){er.textContent='Enter your name.';return}
      if(pw.length<6){er.textContent='Password must be at least 6 characters.';return}
      if(all.some(u=>u.email===email)){er.textContent='An account with this email already exists.';return}
      const salt=uid('s'),u={id:uid('u'),name,email,salt,hash:await hash(pw,salt),createdAt:Date.now()};
      all.push(u);if(!DB.set(USERS,all))return;DB.set(SESSION,u.id);
    }else{
      const u=all.find(x=>x.email===email);
      if(!u||u.hash!==await hash(pw,u.salt)){er.textContent='Wrong email or password.';return}
      DB.set(SESSION,u.id);
    }
    loadMe();closeModal();render();toast(su?'Account created':'Welcome back, '+me.name);
    if(after)after();
  });
  setTimeout(()=>$(su?'an':'ae').focus(),30);
}

/* ---------- register community ---------- */
const CF=[
  ['email','Gmail / Email','name@gmail.com','email',v=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)],
  ['tg','Telegram','@username','text',v=>/^@?[A-Za-z][A-Za-z0-9_]{4,31}$/.test(v)],
  ['phone','Phone number','+251 9XX XXX XXX','tel',v=>/^\+?[0-9\s\-()]+$/.test(v)&&v.replace(/\D/g,'').length>=7&&v.replace(/\D/g,'').length<=15]
];
function formModal(ed){
  const v=ed||{name:'',description:'',memberNames:[],contact:{}},cv={email:v.contact.email,tg:v.contact.telegram,phone:v.contact.phone};
  openModal(`<button class="x" data-close aria-label="Close">&times;</button>
    <h2>${ed?'Edit community':'Register a community'}</h2>
    <div class="hint">${ed?'Your changes go to an admin for review.'+(ed.published?' The version that is public now stays visible until the changes are approved.':''):`Submitted by ${esc(me.name)}. An admin will review it before it appears publicly.`}</div>
    <form id="cf" onsubmit="return false">
      <label for="fn">Name</label><input id="fn" maxlength="80" required placeholder="e.g. Bahir Dar Youth Club" value="${esc(v.name)}">
      <label for="fd">Description</label><textarea id="fd" maxlength="400" required placeholder="What is this community about?">${esc(v.description)}</textarea>
      <label for="fm">Member names</label><textarea id="fm" style="min-height:110px" placeholder="One name per line, or separated by commas">${esc(v.memberNames.join('\n'))}</textarea>
      <div class="hint" id="mc">0 members</div>
      <label style="margin-top:20px">Contact info</label>
      <div class="hint" style="margin:0 0 4px">Fill in at least one, so we can reach the community. Tick “Don’t have” for the others. This is never shown publicly.</div>
      ${CF.map(([k,l,p,t])=>{const off=ed&&!cv[k];return `<label for="c_${k}">${l}</label><input id="c_${k}" type="${t}" placeholder="${p}" maxlength="80" value="${esc(cv[k]||'')}" ${off?'disabled':''}><label class="chk"><input type="checkbox" id="n_${k}" ${off?'checked':''}> I don’t have this</label>`}).join('')}
      <div class="err" id="cerr"></div>
      <div class="row"><button type="button" class="btn ghost" data-close>Cancel</button><button class="btn" type="submit">${ed?'Save &amp; resubmit':'Submit for review'}</button></div>
    </form>`);
  $('mb').querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal);
  const upd=()=>{const n=names($('fm').value).length;$('mc').textContent=`${n} ${n===1?'member':'members'} · counted automatically`};
  $('fm').addEventListener('input',upd);upd();
  for(const [k] of CF){
    $('n_'+k).addEventListener('change',e=>{$('c_'+k).disabled=e.target.checked;if(e.target.checked)$('c_'+k).value=''});
  }
  $('cf').addEventListener('submit',()=>{
    const er=$('cerr'),name=$('fn').value.trim(),description=$('fd').value.trim(),contact={};
    if(!name||!description){er.textContent='Please fill in the name and description.';return}
    let filled=0;
    for(const [k,l,,,ok] of CF){
      if($('n_'+k).checked){contact[k]=null;continue}
      let x=$('c_'+k).value.trim();
      if(!x){er.textContent=`${l}: enter it, or tick “I don’t have this”.`;return}
      if(!ok(x)){er.textContent=`${l} doesn’t look valid.`;return}
      if(k==='tg'&&x[0]!=='@')x='@'+x;
      contact[k]=x;filled++;
    }
    if(!filled){er.textContent='Fill in at least one contact method (email, Telegram or phone).';return}
    const all=apps();
    if(all.some(x=>(!ed||x.id!==ed.id)&&x.status!=='declined'&&x.name.trim().toLowerCase()===name.toLowerCase())){er.textContent='A community with this name already exists or is awaiting review.';return}
    const next={name,description,memberNames:names($('fm').value),contact:{email:contact.email,telegram:contact.tg,phone:contact.phone}};
    if(ed){
      const i=all.findIndex(x=>x.id===ed.id);
      if(i<0||!all[i].submittedBy||all[i].submittedBy.id!==me.id){er.textContent='You can only edit your own submissions.';return}
      const o=all[i];
      if(JSON.stringify(next)===JSON.stringify({name:o.name,description:o.description,memberNames:o.memberNames,contact:o.contact})){er.textContent='Nothing was changed.';return}
      all[i]={...o,...next,status:'pending',reason:'',versions:[...o.versions,{...next,savedAt:Date.now()}]};
      if(!saveApps(all))return;
      closeModal();render();toast('Changes sent for review');return;
    }
    all.unshift({id:uid('c'),...next,status:'pending',submittedBy:{id:me.id,name:me.name,email:me.email},createdAt:Date.now(),versions:[{...next,savedAt:Date.now()}]});
    if(!saveApps(all))return;
    closeModal();render();toast('Submitted — waiting for admin approval');
  });
  setTimeout(()=>$('fn').focus(),30);
}

/* ---------- my submissions ---------- */
function mineModal(){
  const mine=apps().filter(a=>a.submittedBy&&a.submittedBy.id===me.id);
  openModal(`<button class="x" data-close aria-label="Close">&times;</button><h2>My submissions</h2>
    <div style="margin-top:14px">${mine.length?mine.map(a=>`<div style="padding:12px 0;border-top:1px solid var(--line)">
      <div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><b style="overflow-wrap:anywhere">${esc(a.name)}</b><span class="st ${a.status}">${a.status}</span></div>
      <div class="hint">Sent ${date(a.createdAt)} · ${fmt(cnt(a))} members${a.versions.length>1?` · edited ${a.versions.length-1}×`:''}</div>
      ${a.status==='pending'&&a.published?'<div class="hint">Your latest edit is awaiting review. The previous version is still public.</div>':''}
      ${a.status==='declined'&&a.reason?`<div class="hint" style="color:var(--bad)">Reason: ${esc(a.reason)}</div>`:''}
      <div style="margin-top:8px"><button class="btn ghost sm" data-edit="${esc(a.id)}">Edit</button></div></div>`).join(''):'<div class="hint">You haven’t submitted anything yet.</div>'}</div>`);
  $('mb').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const a=apps().find(x=>x.id===b.dataset.edit);if(a)formModal(a)});
}

/* ---------- header buttons ---------- */
$('auth').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.id==='login')authModal('login');
  else if(b.id==='out'){DB.set(SESSION,null);loadMe();render();toast('Logged out')}
  else if(b.id==='mine')mineModal();
  else if(b.id==='add'){
    if(me)formModal(null);
    else{toast('Please log in or sign up to register a community');authModal('signup',()=>formModal(null))}
  }
});
window.addEventListener('storage',()=>{loadMe();render()});
loadMe();render();
</script>
</body>
</html>
